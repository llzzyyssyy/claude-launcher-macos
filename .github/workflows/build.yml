name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Run self-test
        run: ./build/Claude\ 启动器.app/Contents/MacOS/ClaudeLauncher --self-test

      - name: Verify app bundle
        run: codesign --verify --deep --strict --verbose=2 ./build/Claude\ 启动器.app
